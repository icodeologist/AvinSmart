<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Signin - InApp Inventory Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
   <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="./assets/images/favicon_io/site.webmanifest">
  <link rel="stylesheet" href="./assets/scss/style.scss">



</head>

<body>


<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card " style="max-width:420px; width:100%;">
    <div class="card-body p-5">
      <div class="text-center mb-3">
      <a href="index.html" class="avin-logo mb-4" aria-label="AvinSmart"><span class="avin-logo__avin"><span class="avin-logo__a">A</span>vin</span><span class="avin-logo__smart"><span class="avin-logo__s">S</span>mart</span>
      </a>
        <h1 class="card-title mb-5 h5">Sign in to your account</h1>

      </div>

      <form id="signinForm" class="needs-validation mt-3" novalidate>
        <div id="signinAlert" class="alert d-none" role="alert"></div>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input id="email" type="email" class="form-control" placeholder="name@example.com" required autofocus>
          <div class="invalid-feedback">Please enter a valid email.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label d-flex justify-content-between">
            <span>Password</span>
            <a href="#" class="small link-primary">Forgot Password?</a>
          </label>
          <input id="password" type="password" class="form-control" placeholder="Password" required minlength="8">
          <div class="invalid-feedback">Please provide a password (min 8 characters).</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input id="remember" class="form-check-input" type="checkbox">
            <label class="form-check-label small" for="remember">Remember me</label>
          </div>
        </div>

        <button id="signinSubmit" class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>

      <div class="text-center mt-3 small text-muted">
        Don't have an account? <a href="signup.html"  class="link-primary">Sign up</a>
      </div>
    </div>
  </div>
</div>



  <!-- Bootstrap JS -->
  <script src="./assets/js/main.js" type="module"></script>
  <script src="./assets/js/auth.js" type="module"></script>


</body>

</html>""
