services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: avinsmart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avinsmart"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5433:5432"
    volumes:
      - avinsmart-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: :8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/avinsmart?sslmode=disable
      APP_ENV: development
      JWT_SECRET: docker-development-secret-change-me
      JWT_ISSUER: avinsmart-api
      JWT_EXPIRY_HOURS: 24
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8080:8080"

  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: avinsmart_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avinsmart_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    profiles: ["test"]
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://postgres:postgres@test-db:5432/avinsmart_test?sslmode=disable

volumes:
  avinsmart-postgres:
